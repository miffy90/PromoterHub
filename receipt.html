<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Jobs &amp; Receipts · PromoterHub</title>
<style>
:root{--bg:#fff;--bg2:#F7F6F3;--bg3:#EFEDE8;--t1:#1f1f1d;--t2:#5F5E5A;--t3:#9A9890;--bl:rgba(0,0,0,.08);--bm:rgba(0,0,0,.16);--ac:#1f1f1d;--ok:#047857;--err:#B91C1C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg2);color:var(--t1);font-size:15px;line-height:1.45;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:480px;margin:0 auto}
.brand{font-size:13px;color:var(--t3);margin-bottom:4px}
h1{font-size:21px;font-weight:600;margin-bottom:2px}
.sub{font-size:13px;color:var(--t2);margin-bottom:18px}
.card{background:var(--bg);border:1px solid var(--bl);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label small{display:block;font-weight:400;color:var(--t3);font-size:12px}
label:first-child{margin-top:0}
input[type=tel],input[type=text],input[type=number],textarea{width:100%;font-size:17px;padding:12px;border:1px solid var(--bm);border-radius:10px;background:#fff;color:var(--t1);font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--t1);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.rm{position:relative}.rm span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:17px}.rm input{padding-left:46px}
button{font-family:inherit}
.btn{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45}
.btn.ghost{background:#fff;color:var(--t1);border:1px solid var(--bm);margin-top:10px}
.link{background:none;border:none;color:var(--t2);text-decoration:underline;font-size:13px;cursor:pointer}
.msg{font-size:14px;border-radius:10px;padding:10px 12px;margin-top:12px;display:none}
.msg.err{display:block;background:#FEE2E2;color:var(--err)}
.msg.ok{display:block;background:#D1FAE5;color:var(--ok)}
.job{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bm);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.job input{margin-top:3px;width:18px;height:18px;flex-shrink:0}
.job.on{border-color:var(--t1);background:#FFFBEA}
.job b{display:block;font-size:14px}
.job small{color:var(--t2);font-size:12px}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border:2px dashed var(--bm);border-radius:12px;background:var(--bg2);font-size:15px;font-weight:600;color:var(--t1);cursor:pointer}
#preview{display:none;margin-top:10px;border-radius:10px;max-width:100%;max-height:340px;object-fit:contain;background:var(--bg3);width:100%}
.hello{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.hello b{font-size:17px}
.rc{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bl);font-size:13px}
.rc:first-of-type{border-top:none}
.rc span{color:var(--t2)}
.empty{color:var(--t3);font-size:13px;text-align:center;padding:10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}
.rcard{border:1px solid var(--bm);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff;position:relative}
.rcard h3{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--t2)}
.rcard .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bl);background:var(--bg2);font-size:16px;color:var(--t2);cursor:pointer}
.rcard img{display:block;width:100%;max-height:260px;object-fit:contain;background:var(--bg3);border-radius:8px;margin-top:8px}
.rcard label{margin-top:10px}
.addmore{display:flex;gap:8px;margin-top:4px}
.addmore button,.addmore label{flex:1;margin:0;padding:12px;border:1px solid var(--bm);border-radius:10px;background:#fff;font-size:14px;font-weight:600;color:var(--t1);text-align:center;cursor:pointer}
.sum{font-size:14px;margin-top:12px;color:var(--t2)}
.sum b{color:var(--t1)}
.rate{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bl)}
.rate:first-child{border-top:none;padding-top:2px}
.rate .nm{flex:1;min-width:0}.rate .nm b{display:block;font-size:14px}.rate .nm small{color:var(--t2);font-size:12px}
.rm.sm{width:112px;flex-shrink:0}.rm.sm input{font-size:16px;padding:10px 8px 10px 40px}.rm.sm span{font-size:15px}
.rate .sv{padding:10px 12px;border:none;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;font-size:14px;cursor:pointer;flex-shrink:0}
.rate .sv:disabled{opacity:.5}
.rate .st{width:14px;color:var(--ok);font-weight:700;flex-shrink:0}
.pj{background:#fff;border:1px solid var(--bm);border-left:6px solid var(--bm);border-radius:12px;padding:12px;margin-bottom:10px}
.pj.ok{background:#F6FDF9}
.pjt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.pjt b{font-size:16px}
.pj>small,.pjhdr small{display:block;color:var(--t2);font-size:12px;margin:2px 0 6px}
.pjhdr{margin:10px 0 4px}.pjhdr b{font-size:17px}
.chip{flex-shrink:0;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;background:#FEF3C7;color:#92400E;white-space:nowrap}.chip.g{background:#D1FAE5;color:#065F46}
.step{display:flex;align-items:center;gap:8px;padding:9px 0 0;margin-top:9px;border-top:1px dashed var(--bl);flex-wrap:wrap}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--bg3);color:var(--t2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .n.on{background:#10B981;color:#fff}
.step .sl{font-size:13px;font-weight:600;flex:1;min-width:70px}.step .sl small{display:block;font-weight:400;color:var(--t3);font-size:11px}
.step .s2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;padding-left:32px}
.mini{border:1px solid var(--bm);background:#fff;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t1);line-height:1.2}
.mini small{font-weight:400;color:var(--t3);font-size:11px}
.mini.dark{background:var(--ac);color:#fff;border-color:var(--ac)}.mini:disabled{opacity:.5}
.okt{color:var(--ok);font-weight:600;font-size:13px;margin-right:4px}
.smh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t2);margin:10px 0 4px}
.sm-t{width:100%;border-collapse:collapse;font-size:14px}.sm-t td{padding:7px 0;border-top:1px solid var(--bl);vertical-align:top}
.sm-t td small{display:block;color:var(--t2);font-size:12px}.sm-t .amt{text-align:right;white-space:nowrap;font-weight:600;padding-left:8px}
.sm-t tr.tt td{font-weight:700;border-top:2px solid var(--t1)}
.miss{color:#B45309}
.note{font-size:12px;color:var(--t3);margin-top:10px;line-height:1.4}
.job .sent{display:inline-block;margin-top:5px;font-size:12px;font-weight:600;color:var(--ok);background:#D1FAE5;border-radius:6px;padding:1px 7px}
.done-box{text-align:center;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:16px;color:#065F46;font-size:14px}
.done-box .big{font-size:30px;line-height:1;margin-bottom:6px}.done-box b{display:block;font-size:17px;margin-bottom:4px}
.wd .wdh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.wd .wdh b{font-size:15px}.wd .wdh b small{display:block;font-weight:400;color:var(--t3);font-size:12px}
.wd .lg{display:flex;gap:4px;flex-wrap:wrap}.wd .lg .chp{font-size:11px;padding:2px 7px;pointer-events:none}
.wdm{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.wml{width:62px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--t1);padding-top:6px}.wml.past{color:var(--t3)}
.wdc{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.chp{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bm);background:#fff;border-radius:8px;padding:4px 8px;font-size:13px;font-family:inherit;color:var(--t1);cursor:pointer}
.chp i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chp.past{background:var(--bg3);border-color:transparent;color:var(--t3)}
.chp.tdy{border:2px solid var(--t1);font-weight:700;padding:3px 7px}
.chp.sel{box-shadow:0 0 0 2px #3B82F6}
.dinfo{margin-top:10px;background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:13px}
.dinfo .di{display:flex;gap:8px;margin-top:6px}.dinfo .di i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid:empty{display:none}
.ph{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--bg3)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
.ph i{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-style:normal;border-radius:6px;padding:1px 6px}
.tabs{display:flex;gap:6px;background:var(--bg3);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:none;background:none;padding:10px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--t2);cursor:pointer}
.tabs .n.hide{display:none}
.tabs button.on{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#F59E0B;color:#fff;font-size:11px;line-height:18px}
.jc{border:1px solid var(--bm);border-left:6px solid var(--bm);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.jc .d{font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.3px}
.jc .p{font-size:16px;font-weight:600;margin:0 0 2px}
.mh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t2);margin:16px 2px 8px}
.mh:first-child{margin-top:0}
.dts{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.dt{font-size:14px;font-weight:600}.dt.past{color:var(--t3);font-weight:500}
.jc.done{background:var(--bg2)}.jc.done .p,.jc.done .o{color:var(--t3)}
.donetag{display:inline-block;font-size:11px;font-weight:600;background:var(--bg3);color:var(--t2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}.dt small{font-weight:400;color:var(--t2);font-size:12px;margin-left:4px}
.jc .o{font-size:13px;color:var(--t2)}
.jc .st{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.jc .ok{color:var(--ok);font-size:14px;font-weight:600}
.jc .warn{background:#FEE2E2;color:var(--err);font-size:13px;border-radius:8px;padding:7px 10px;margin-top:10px}
.cbtn{padding:10px 16px;font-size:15px;font-weight:600;border:none;border-radius:10px;background:var(--ac);color:#fff;cursor:pointer;flex:1}
.cbtn:disabled{opacity:.5}
.today{display:inline-block;font-size:11px;background:#1f1f1d;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">PromoterHub</div>
  <h1>My jobs &amp; receipts</h1>
  <div class="sub">See your jobs and send sampling receipts.<br>Lihat kerja anda dan hantar resit sampling.</div>

  <!-- SIGN IN -->
  <div id="v-login" class="card hide">
    <label for="phone">Phone number <small>Nombor telefon</small></label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="012-345 6789">
    <label for="ic4">Last 4 digits of your IC <small>4 digit terakhir IC anda</small></label>
    <input id="ic4" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234">
    <button class="btn" id="b-login" onclick="login()">Continue / Teruskan</button>
    <div id="m-login" class="msg"></div>
  </div>

  <!-- UPLOAD -->
  <div id="v-main" class="hide">
    <div class="hello"><div>Hi <b id="who"></b></div><button class="link" onclick="logout()">Not you? / Bukan anda?</button></div>
    <div class="tabs"><button id="tb-jobs" class="on" onclick="tab('jobs')">📅 My jobs</button><button id="tb-rc" onclick="tab('rc')">🧾 Claim</button></div>
    <div id="t-jobs">
      <div id="m-jobs" class="msg"></div>
      <div id="wdates"></div>
      <div id="joblist"></div>
    </div>
    <div id="t-rc" class="hide">
      <div id="pj-view">
        <div class="sub" id="pj-head"></div>
        <div id="pjlist"></div>
        <div id="m-pj" class="msg"></div>
        <div class="card" style="margin-top:14px">
          <label>My summary <small>Ringkasan saya — anggaran / estimate</small></label>
          <div id="summary"></div>
        </div>
        <div class="card">
          <label>Your receipts <small>Resit anda</small></label>
          <div id="mine"></div>
        </div>
      </div>
      <div id="rc-view" class="hide">
        <div class="card">
          <button class="link" onclick="backToProjects()">‹ Back to my projects / Kembali</button>
          <div id="rc-proj" class="pjhdr"></div>
          <div id="rc-done" class="hide"></div>
          <div id="rc-form">
            <label>Receipt photos <small>Gambar resit — boleh pilih banyak sekali gus</small></label>
            <div class="grid" id="grid"></div>
            <div class="addmore">
              <label for="cam">📷 Take photo<br><small style="font-weight:400;color:var(--t3)">Ambil gambar</small></label>
              <label for="multi">🖼 Choose photos<br><small style="font-weight:400;color:var(--t3)">Pilih gambar</small></label>
            </div>
            <input id="cam" type="file" accept="image/*" capture="environment" class="hide" onchange="pickMany(this)">
            <input id="multi" type="file" accept="image/*" multiple class="hide" onchange="pickMany(this)">
            <label>Total amount for all these receipts <small>Jumlah keseluruhan semua resit</small></label>
            <div class="rm"><span>RM</span><input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
            <label>What did you buy? <small>Barang dibeli (cth: air mineral untuk sampling)</small></label>
            <input id="item" type="text" maxlength="200" placeholder="e.g. mineral water for sampling">
            <div class="sum" id="sum"></div>
            <button class="btn" id="b-send" onclick="send()">Send / Hantar</button>
            <div id="m-send" class="msg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxKVKm9i9OCeIcUJlX3F33K7Vb8fOdd39BscSTLsWUDWd2j_w7XkFiHQG9Jq2eJ7A2Y/exec';
const TK='ph_rc_token';
let token=null, photo=null, jobId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>new Date(iso+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtW=iso=>new Date(iso+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const dayISO=o=>{ const d=new Date(); d.setDate(d.getDate()+(o||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let allJobs=[], claimGroups=[], myReceipts=[];
// total already sent for a project/month (receipts carry the job's name + start date)
function sentFor(g){ return myReceipts.filter(r=>r.evName===g.name && String(r.sdate||'').slice(0,7)===g.m && Number(r.amount)>0).reduce((t,r)=>t+Number(r.amount),0); }
const RC_FROM='2026-11-01';   // receipts only for jobs from this date (same rule on the server)
function tab(t){ $('t-jobs').classList.toggle('hide',t!=='jobs'); $('t-rc').classList.toggle('hide',t!=='rc'); $('tb-jobs').classList.toggle('on',t==='jobs'); $('tb-rc').classList.toggle('on',t==='rc'); }
function show(v){ $('v-login').classList.toggle('hide',v!=='login'); $('v-main').classList.toggle('hide',v!=='main'); }
function msg(id,t,kind){ const m=$(id); m.className='msg'+(t?' '+(kind||'err'):''); m.textContent=t||''; }
try{ token=localStorage.getItem(TK); }catch(e){}

async function call(action,data){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,data})});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'Something went wrong');
  return j.data;
}

async function login(){
  const b=$('b-login'); msg('m-login','');
  b.disabled=true; b.innerHTML='<span class="spin"></span>Checking…';
  try{
    const d=await call('rcLogin',{phone:$('phone').value, ic4:$('ic4').value});
    token=d.token; try{ localStorage.setItem(TK,token); }catch(e){}
    await load();
  }catch(e){ msg('m-login', e.message==='Failed to fetch'?'No connection — please try again.':e.message); }
  b.disabled=false; b.textContent='Continue / Teruskan';
}
function logout(){ token=null; try{ localStorage.removeItem(TK); }catch(e){} $('phone').value=''; $('ic4').value=''; show('login'); }

async function load(){
  try{
    const d=await call('rcJobs',{token});
    $('who').textContent=d.name; myReceipts=d.receipts||[];
    allJobs=(d.jobs||[]).slice().sort((a,b)=>(a.sdate+(a.stime||'')).localeCompare(b.sdate+(b.stime||'')));
    renderJobs();
    const hi=dayISO(30), thisMonth=dayISO(0).slice(0,7)+'-01';   // a month's projects disappear once the month is over
    // receipts are claimed per month: one choice per month + project + outlet (same grouping as the claim form);
    // the receipt is linked to the latest job of that group so it lands on the right claim line
    const today=dayISO(0), grp=new Map();
    // only November 2026 onward, and not jobs already in a submitted/paid claim
    allJobs.filter(j=>j.sdate>=RC_FROM && j.sdate>=thisMonth && !j.claimed && j.sdate<=hi).forEach(j=>{
      const k=j.sdate.slice(0,7)+'|'+String(j.name).trim().toLowerCase()+'|'+String(j.outlet||'').trim().toLowerCase();
      if(!grp.has(k)) grp.set(k,{m:j.sdate.slice(0,7), name:j.name, outlet:j.outlet, list:[]});
      grp.get(k).list.push(j);
    });
    const jobs=[...grp.values()].map(g=>{
      g.list.sort((a,b)=>a.sdate.localeCompare(b.sdate));
      const started=g.list.filter(j=>j.sdate<=today);
      g.id=(started.length?started[started.length-1]:g.list[0]).id;
      const days=new Set(); g.list.forEach(j=>{ for(let d=new Date(j.sdate+'T12:00'); d<=new Date((j.edate||j.sdate)+'T12:00'); d.setDate(d.getDate()+1)) days.add(d.toDateString()); });
      g.n=days.size; g.from=g.list[0].sdate; g.to=g.list[g.list.length-1].edate||g.list[g.list.length-1].sdate;
      return g;
    });
    const cm=today.slice(0,7), rank=m=>m===cm?0:m<cm?1:2;   // this month first, then last month(s), then next month
    jobs.sort((a,b)=>rank(a.m)-rank(b.m)||(rank(a.m)===1?b.m.localeCompare(a.m):a.m.localeCompare(b.m))||a.name.localeCompare(b.name));
    claimGroups=jobs; renderProjects();
    const all=myReceipts, extra={};
    all.forEach(r=>{ const m=String(r.id).match(/^(.+)-[^-]+$/); if(m) extra[m[1]]=(extra[m[1]]||0)+1; });
    const rc=all.filter(r=>!/-/.test(String(r.id))).map(r=>Object.assign({},r,{item:r.item+((extra[r.id]||0)?` · ${extra[r.id]+1} photos`:'')}));
    $('mine').innerHTML = rc.length ? rc.map(r=>`<div class="rc"><div>${esc(r.evName)}<br><span>${esc(r.item)}</span></div><div style="text-align:right;white-space:nowrap"><b>RM ${Number(r.amount).toFixed(2)}</b><br><span>${new Date(r.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div></div>`).join('')
      : '<div class="empty">No receipts yet. / Belum ada resit.</div>';
    show('main');
  }catch(e){ if(/sign in/i.test(e.message)){ logout(); msg('m-login',e.message); } else { show('main'); const t=e.message==='Failed to fetch'?'No connection — please try again.':e.message; msg('m-pj',t); msg('m-jobs',t); } }
}

// ── my jobs: upcoming list (view only) ──
// group upcoming job days by month → project: one entry per project per month, consecutive days joined
function groupJobs(list, from, getOutlet, today){
  today=today||from;
  const addDay=(d,n)=>{ const x=new Date(d+'T12:00'); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  const months=new Map();
  list.forEach(j=>{
    const ed=j.edate||j.sdate, time=j.stime?(j.stime+(j.etime?' – '+j.etime:'')):'', outlet=getOutlet(j)||'';
    for(let d=j.sdate; d<=ed; d=addDay(d,1)){
      if(d<from) continue;
      const m=d.slice(0,7), pk=String(j.name||'').trim().toLowerCase()+'|'+(j.color||'');
      if(!months.has(m)) months.set(m,new Map());
      const g=months.get(m); if(!g.has(pk)) g.set(pk,{name:String(j.name||'').trim(), color:j.color||'', days:[]});
      g.get(pk).days.push({d, time, outlet, past:d<today});
    }
  });
  return [...months.keys()].sort().map(m=>({m, projects:[...months.get(m).values()].map(p=>{
    p.days.sort((a,b)=>a.d.localeCompare(b.d));
    const runs=[];   // consecutive days with the same time + outlet
    p.days.forEach(x=>{ const r=runs[runs.length-1];
      if(r && addDay(r.to,1)===x.d && r.time===x.time && r.outlet===x.outlet && r.past===x.past) r.to=x.d;
      else if(!(r && r.to===x.d)) runs.push({from:x.d,to:x.d,time:x.time,outlet:x.outlet,past:x.past}); });
    const times=[...new Set(runs.map(r=>r.time))], outlets=[...new Set(runs.map(r=>r.outlet))];
    return {name:p.name, color:p.color, done:p.days.every(x=>x.past), live:p.days.some(x=>x.d===today), first:p.days[0].d, n:new Set(p.days.map(x=>x.d)).size, runs, times, outlets};
  }).sort((a,b)=>a.first.localeCompare(b.first))}));
}
const AG_COLOR={blue:'#3B82F6',green:'#10B981',amber:'#F59E0B',purple:'#8B5CF6',red:'#EF4444',pink:'#EC4899',teal:'#14B8A6',orange:'#F97316',slate:'#64748B'};
// working dates overview: one row per month, a chip per working day (past grey, upcoming white + agency dot)
function renderDates(){
  const today=dayISO(0), days=new Map();
  allJobs.forEach(j=>{ for(let d=new Date(j.sdate+'T12:00'); d<=new Date((j.edate||j.sdate)+'T12:00'); d.setDate(d.getDate()+1)){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!days.has(k)) days.set(k,[]); days.get(k).push(j); } });
  if(!days.size){ $('wdates').innerHTML=''; return; }
  const ks=[...days.keys()].sort(), months=[...new Set(ks.map(k=>k.slice(0,7)))];
  const up=ks.filter(k=>k>=today).length;
  $('wdates').innerHTML=`<div class="card wd">
    <div class="wdh"><b>Working dates <small>Tarikh kerja</small></b>
      <span class="lg"><span class="chp">Upcoming</span><span class="chp past">Past</span><span class="chp tdy">Today</span></span></div>
    <div class="sub" style="margin:2px 0 8px">${up?`<b>${up}</b> upcoming day${up>1?'s':''} / hari akan datang`:'No upcoming days / Tiada hari akan datang'}</div>
    ${months.map(m=>`<div class="wdm"><div class="wml${ks.filter(k=>k.startsWith(m)).every(k=>k<today)?' past':''}">${new Date(m+'-15T12:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</div><div class="wdc">${
      ks.filter(k=>k.startsWith(m)).map(k=>{ const js=days.get(k), cls=k<today?'past':k===today?'tdy':'';
        return `<button class="chp ${cls}" data-d="${k}" onclick="dayInfo(this)"><i style="background:${k<today?'#9A9890':(AG_COLOR[js[0].color]||'#9A9890')}"></i>${new Date(k+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})}${js.length>1?' ×'+js.length:''}</button>`; }).join('')}</div></div>`).join('')}
    <div id="dinfo" class="dinfo hide"></div>
  </div>`;
  window._days=days;
}
function dayInfo(btn){
  const k=btn.dataset.d, js=(window._days&&window._days.get(k))||[], box=$('dinfo');
  document.querySelectorAll('.wd .chp.sel').forEach(x=>x.classList.remove('sel'));
  if(box.dataset.d===k && !box.classList.contains('hide')){ box.classList.add('hide'); box.dataset.d=''; return; }
  btn.classList.add('sel'); box.dataset.d=k; box.classList.remove('hide');
  box.innerHTML=`<b>${new Date(k+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>`+
    js.map(j=>`<div class="di"><i style="background:${AG_COLOR[j.color]||'#9A9890'}"></i><div><b>${esc(j.name)}</b><br>📍 ${esc(j.outlet||'—')}${j.stime?' · 🕘 '+esc(j.stime+(j.etime?' – '+j.etime:'')):''}</div></div>`).join('');
}
function renderJobs(){
  renderDates();
  // whole current month (past days ticked + grey) and every month after
  const today=dayISO(0), groups=groupJobs(allJobs, today.slice(0,7)+'-01', j=>j.outlet, today);
  if(!groups.length){ $('joblist').innerHTML='<div class="card empty">No jobs this month or later.<br>Tiada kerja bulan ini atau akan datang.</div>'; return; }
  const dd=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
  const mn=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{month:'long'});
  const span=r=>(r.from===r.to?dd(r.from):dd(r.from)+' – '+dd(r.to))+' '+mn(r.to);
  $('joblist').innerHTML=groups.map(g=>`<div class="mh">${new Date(g.m+'-15T12:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>`+
    g.projects.map(p=>{
      const sameT=p.times.length===1, sameO=p.outlets.length===1;
      const dates=p.runs.map(r=>`<span class="dt${r.past?' past':''}">${r.past?'✓ ':''}${span(r)}${!sameT&&r.time?' <small>🕘 '+esc(r.time)+'</small>':''}${!sameO&&r.outlet?' <small>📍 '+esc(r.outlet)+'</small>':''}</span>`).join('');
      return `<div class="jc${p.done?' done':''}" style="border-left-color:${AG_COLOR[p.color]||'var(--bm)'}">
        <div class="p">${esc(p.name)}${p.live?'<span class="today">TODAY</span>':''}${p.done?'<span class="donetag">✓ Done / Selesai</span>':''}</div>
        <div class="d">${p.n} day${p.n>1?'s':''} / hari</div>
        <div class="dts">${dates}</div>
        <div class="o">${sameO?'📍 '+esc(p.outlets[0]||'—'):''}${sameO&&sameT&&p.times[0]?'<br>':''}${sameT&&p.times[0]?'🕘 '+esc(p.times[0]):''}</div>
      </div>`; }).join('')).join('');
}

// ── claim flow per project + month: 1) salary per day  2) receipts or "no receipt claim" ──
let curG=null;
const monL=m=>new Date(m+'-15T12:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const money=v=>'RM '+Number(v||0).toFixed(2);
function gRate(g){ const v=[...new Set(g.list.map(j=>j.myRate||''))]; return v.length===1?v[0]:(v.includes('')?'':'mixed'); }
function gNoRc(g){ return g.list.every(j=>j.noRc); }
function gDone(g){ return !!gRate(g) && (sentFor(g)>0 || gNoRc(g)); }
function jobDays(j){ let n=0; for(let d=new Date(j.sdate+'T12:00'); d<=new Date((j.edate||j.sdate)+'T12:00'); d.setDate(d.getDate()+1)) n++; return n; }
function renderProjects(){
  const G=claimGroups;
  if(!G.length){ $('pj-head').innerHTML=''; $('pjlist').innerHTML='<div class="card empty">Nothing to claim right now.<br>Tiada projek untuk dituntut sekarang.</div>'; renderSummary(); return; }
  const done=G.filter(gDone).length;
  $('pj-head').innerHTML = done===G.length
    ? `<div class="msg ok" style="display:block;margin:0 0 10px">✓ All ${G.length} project${G.length>1?'s':''} done. Thank you! / Semua selesai.</div>`
    : `For each project: <b>1</b> salary per day, <b>2</b> receipts or "no receipt claim".<br>Untuk setiap projek: <b>1</b> gaji sehari, <b>2</b> resit atau "tiada tuntutan". <b>${done} of ${G.length} done</b>`;
  $('pjlist').innerHTML=G.map((g,i)=>{
    const r=gRate(g), sent=sentFor(g), no=gNoRc(g), ok=gDone(g), left=(r?0:1)+((sent>0||no)?0:1);
    const step2 = sent>0
      ? `<span class="okt">✓ ${money(sent)} receipts sent</span><button class="mini" onclick="openRc(${i})">＋ Add more</button>`
      : no ? `<span class="okt">✓ No receipt claim / Tiada tuntutan</span><button class="mini" onclick="setNoRc(${i},false,this)">Undo</button>`
      : `<button class="mini dark" onclick="openRc(${i})">📷 Upload receipt</button><button class="mini" onclick="setNoRc(${i},true,this)">No receipt claim<br><small>Tiada tuntutan</small></button>`;
    return `<div class="pj${ok?' ok':''}" style="border-left-color:${AG_COLOR[g.list[0].color]||'var(--bm)'}">
      <div class="pjt"><b>${esc(g.name)}</b><span class="chip ${ok?'g':''}">${ok?'✓ Done':left+' step'+(left>1?'s':'')+' left'}</span></div>
      <small>${monL(g.m)} · ${g.n} day${g.n>1?'s':''}${g.outlet?' · '+esc(g.outlet):''}</small>
      <div class="step"><span class="n${r?' on':''}">${r?'✓':'1'}</span><div class="sl">Salary / day<small>Gaji sehari</small></div>
        <div class="rm sm"><span>RM</span><input type="number" inputmode="decimal" step="0.01" min="0" id="rt${i}" value="${r&&r!=='mixed'?esc(r):''}" placeholder="${r==='mixed'?'mixed':'0'}"></div>
        <button class="mini dark" onclick="saveRate(${i},this)">Save</button></div>
      <div class="step"><span class="n${(sent>0||no)?' on':''}">${(sent>0||no)?'✓':'2'}</span><div class="sl">Receipts<small>Resit</small></div><div class="s2">${step2}</div></div>
    </div>`; }).join('');
  renderSummary();
}
function renderSummary(){
  const G=claimGroups, months=[...new Set(G.map(g=>g.m))];
  if(!G.length){ $('summary').innerHTML='<div class="empty">No projects yet.</div>'; return; }
  $('summary').innerHTML=months.map(m=>{
    let mt=0, missing=false;
    const rows=G.filter(g=>g.m===m).map(g=>{
      const r=gRate(g); let sal=0, has=true;
      g.list.forEach(j=>{ if(Number(j.myRate)>0) sal+=jobDays(j)*Number(j.myRate); else has=false; });
      const rc=sentFor(g), tot=sal+rc; mt+=tot; if(!has) missing=true;
      return `<tr><td><b>${esc(g.name)}</b><small>${g.n} day${g.n>1?'s':''} × ${r&&r!=='mixed'?'RM '+Number(r).toFixed(2):r==='mixed'?'mixed':'<span class="miss">salary?</span>'}${rc?' + receipts '+money(rc):''}</small></td>
        <td class="amt">${has?money(tot):'<span class="miss">—</span>'}</td></tr>`; }).join('');
    return `<div class="smh">${monL(m)}</div><table class="sm-t">${rows}
      <tr class="tt"><td>Total${missing?' <small class="miss">(fill in all salaries)</small>':''}</td><td class="amt">${mt||!missing?money(mt):'—'}</td></tr></table>`;
  }).join('')+'<div class="note">Estimate from your days × salary + receipts. Final amount is confirmed by Kareen (public holidays, adjustments).<br>Anggaran sahaja. Jumlah akhir disahkan oleh Kareen.</div>';
}
async function saveRate(i,btn){
  const g=claimGroups[i], v=$('rt'+i).value.trim(); msg('m-pj','');
  if(v!=='' && !(Number(v)>0)) return msg('m-pj','Enter your salary per day (RM). / Masukkan gaji sehari.');
  btn.disabled=true; btn.textContent='…';
  try{
    const r=await call('rcRate',{token, evIds:g.list.map(j=>j.id), rate:v});
    g.list.forEach(j=>{ j.myRate=r.rate; });
    renderProjects();
  }catch(e){ btn.disabled=false; btn.textContent='Save'; fail(e,'m-pj'); }
}
async function setNoRc(i,on,btn){
  const g=claimGroups[i]; msg('m-pj',''); btn.disabled=true;
  try{
    const r=await call('rcNoClaim',{token, evIds:g.list.map(j=>j.id), on});
    g.list.forEach(j=>{ j.noRc=r.noRc; });
    renderProjects();
  }catch(e){ btn.disabled=false; fail(e,'m-pj'); }
}
function fail(e,box){
  if(/sign in/i.test(e.message)){ logout(); msg('m-login',e.message); }
  else msg(box, e.message==='Failed to fetch'?'No connection — please try again. / Tiada sambungan.':e.message);
}
function openRc(i){
  curG=claimGroups[i]; partOf=null; photos=[]; renderGrid(); $('amt').value=''; $('item').value=''; msg('m-send','');
  $('rc-proj').innerHTML=`<b>${esc(curG.name)}</b><small>${monL(curG.m)} · ${curG.n} day${curG.n>1?'s':''}${curG.outlet?' · '+esc(curG.outlet):''}${sentFor(curG)?' · already sent '+money(sentFor(curG)):''}</small>`;
  $('rc-done').classList.add('hide'); $('rc-form').classList.remove('hide');
  $('pj-view').classList.add('hide'); $('rc-view').classList.remove('hide'); window.scrollTo({top:0,behavior:'smooth'});
}
function backToProjects(){
  $('rc-view').classList.add('hide'); $('pj-view').classList.remove('hide'); renderProjects(); window.scrollTo({top:0,behavior:'smooth'});
}
function showDone(d){
  const left=claimGroups.filter(g=>!gDone(g)).length;
  $('rc-done').innerHTML=`<div class="done-box">
      <div class="big">✓</div>
      <b>${money(d.amount)} sent · ${d.photos} photo${d.photos>1?'s':''}</b>
      <div>Terima kasih! Resit dihantar.</div>
    </div>
    <button class="btn" onclick="backToProjects()">‹ Back to my projects${left?` (${left} not done)`:''}<br><small style="font-weight:400;opacity:.8">Kembali ke projek saya</small></button>
    <button class="btn ghost" onclick="openRc(claimGroups.indexOf(curG))">＋ More receipts for this project<br><small style="font-weight:400;color:var(--t3)">Tambah resit untuk projek ini</small></button>`;
  $('rc-form').classList.add('hide'); $('rc-done').classList.remove('hide');
}

// ── one receipt set: several photos + one total amount + one description ──
let photos=[], seq=0, partOf=null;   // partOf: id of the first photo already sent (resume after a failed send)
function renderGrid(){
  $('grid').innerHTML=photos.map((p,i)=>`<div class="ph"><img src="${p.url}" alt="receipt ${i+1}"><i>${i+1}</i><button title="Remove" onclick="removePhoto(${p.id})">✕</button></div>`).join('');
  $('sum').innerHTML=photos.length?`<b>${photos.length}</b> photo${photos.length>1?'s':''} / gambar`:'';
}
function removePhoto(id){ photos=photos.filter(p=>p.id!==id); renderGrid(); }

// Shrink each photo on the phone before sending (max ~1600px, ~300–600 KB)
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      let q=0.75, data=c.toDataURL('image/jpeg',q);
      while(data.length>1400000 && q>0.35){ q-=0.1; data=c.toDataURL('image/jpeg',q); }
      URL.revokeObjectURL(url); res(data);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not read this photo. Please take a new photo. / Gambar tidak dapat dibaca.')); };
    img.src=url;
  });
}
async function pickMany(input){
  const files=[...(input.files||[])]; input.value=''; if(!files.length) return; msg('m-send','');
  for(const f of files){
    try{ const data=await shrink(f); photos.push({id:++seq, url:data, b64:data.split(',')[1]}); renderGrid(); }
    catch(e){ msg('m-send',e.message); }
  }
}

async function send(){
  if(!curG) return backToProjects();
  const evId=curG.id;
  if(!photos.length) return msg('m-send','Add the receipt photo(s). / Tambah gambar resit.');
  const amount=$('amt').value, item=$('item').value.trim();
  if(!partOf && !(Number(amount)>0)) return msg('m-send','Enter the total amount. / Masukkan jumlah keseluruhan.');
  if(!item) return msg('m-send','Write what you bought. / Tulis barang yang dibeli.');
  const b=$('b-send'); b.disabled=true; msg('m-send','');
  const total=photos.length; let sent=0;
  try{
    while(photos.length){
      const p=photos[0];
      b.innerHTML=`<span class="spin"></span>Sending photo ${sent+1} of ${total}…`;
      const r=await call('rcUpload', partOf ? {token, evId, partOf, item, image:p.b64}
                                            : {token, evId, amount, item, image:p.b64});
      if(!partOf) partOf=r.id;
      photos.shift(); sent++; renderGrid();
    }
    partOf=null; $('amt').value=''; $('item').value='';
    const key=curG.m+'|'+curG.name+'|'+curG.outlet;
    await load();
    curG=claimGroups.find(g=>g.m+'|'+g.name+'|'+g.outlet===key)||curG;
    showDone({amount, photos:total});
  }catch(e){
    const why=e.message==='Failed to fetch'?'No connection.':e.message;
    msg('m-send', (sent?`${sent} photo${sent>1?'s':''} sent, `:'')+`${photos.length} not sent — ${why} Press Send again. / Tekan Hantar semula.`);
  }
  b.disabled=false; b.textContent='Send / Hantar';
}
if(/receipt/i.test(location.hash)) tab('rc');
if(token) load(); else show('login');
</script>
